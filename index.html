    } else {
      const r = CP.readAt(a, L, lon, lat);
      html = r.inside && r.value != null ? `<b>${fmt(r.value, L.dec)}</b> ${esc(L.unit)} · ${esc(L.short)}<br><span class="hint">classe ${esc(r.range)} ${esc(L.unit)} · ponto tocado</span>` : `<span class="hint">Fora da área</span>`;
    }
    const pr = $('#probe'); pr.innerHTML = `<button class="x" aria-label="Fechar">×</button>${html}`; pr.hidden = false;
    pr.querySelector('.x').onclick = () => { pr.hidden = true; };
  }

  // ------------------------------------------------------------------ gaveta: camadas e leitura
  function renderSheet() {
    const a = S.area; if (!a) return;
    const groups = [['sup', `${a.depthSup || 'superfície'} cm`], ['sub', a.depthSub ? `${a.depthSub} cm` : null], ['rx', 'Prescrição']].filter((g) => g[1] && a.layers.some((l) => l.grupo === g[0]));
    $('#groups').innerHTML = groups.map(([g, l]) => `<button data-g="${g}" aria-selected="${S.grupo === g}">${esc(l)}</button>`).join('');
    $('#groups').querySelectorAll('button').forEach((b) => { b.onclick = () => { S.grupo = b.dataset.g; const first = a.layers.find((l) => l.grupo === S.grupo); if (first && layerOf().grupo !== S.grupo) selectLayer(first.id); else renderSheet(); }; });
    const chips = a.layers.filter((l) => l.grupo === S.grupo);
    $('#chips').innerHTML = chips.map((l) => `<button data-l="${esc(l.id)}" aria-selected="${l.id === S.layerId}">${esc(l.short)}</button>`).join('');
    $('#chips').querySelectorAll('button').forEach((b) => { b.onclick = () => selectLayer(b.dataset.l); });
    scrollChip();
    renderReadout();
    renderLegend();
  }
  function scrollChip() {
    const box = $('#chips'), sel = $('#chips button[aria-selected="true"]');
    if (box && sel) box.scrollLeft = Math.max(0, sel.offsetLeft - box.clientWidth / 2 + sel.offsetWidth / 2);
  }
  function selectLayer(id) {
    S.layerId = id; S.grupo = layerOf().grupo;
    CP.db.setConfig('layer:' + S.area.id, id);
    setMapLayer(true);
  }
  function renderReadout() {
    const a = S.area, L = layerOf(); const el = $('#readout');
    if (!L) { el.innerHTML = '<div class="big-msg">Escolha uma camada</div>'; return; }
    const f = S.fix;
    const gpsLine = () => {
      if (!f) return `<div class="gps"><span><span class="dot off"></span>${esc(S.gpsMsg || 'Aguardando o GPS…')}</span></div>`;
      const old = CP.gps.stale();
      return `<div class="gps"><span><span class="dot${old ? ' old' : ''}"></span>GPS ±${fmt(f.acc, 0)} m · ${ago(f.t)}</span>${f.speed != null && f.speed > 0.3 ? `<span>${fmt(f.speed * 3.6, 1)} km/h</span>` : ''}${f.heading != null ? `<span>rumo ${fmt(f.heading, 0)}°</span>` : ''}</div>`;
    };
    if (!f) { el.innerHTML = `<div class="big-msg">${esc(L.label)}</div>${gpsLine()}`; return; }
    const r = CP.readAt(a, L, f.lon, f.lat);
    if (!r.inside) {
      let dmin = Infinity;
      for (const ring of a.rings) for (const q of ring) { const d = CP.gps.distance([f.lon, f.lat], q); if (d < dmin) dmin = d; }
      el.innerHTML = `<div class="big-msg">Fora da área${Number.isFinite(dmin) ? ` · a ${dmin >= 1000 ? fmt(dmin / 1000, 1) + ' km' : fmt(dmin, 0) + ' m'} do contorno` : ''}</div>${gpsLine()}`;
      return;
    }
    const near = CP.nearestPoint(a, r.x, r.y, L.grupo === 'sub');
    const pv = near ? CP.pointValue(L, near.p) : null;
    el.innerHTML = `<div class="val">${r.value == null ? '—' : fmt(r.value, L.dec)}<small>${esc(L.unit)}</small></div>
      <div><div class="sw" style="background:${r.color || 'transparent'}"></div><div class="cls">${esc(L.short)} · classe ${esc(r.range)} ${esc(L.unit)}</div></div>
      ${near ? `<div class="near">Ponto <b>${esc(near.p.id)}</b> a ${fmt(near.dist, 0)} m · ${L.grupo === 'rx' ? 'dose no ponto' : 'laudo'}: <b>${pv == null ? '—' : fmt(pv, L.dec)}</b> ${esc(L.unit)}</div>` : ''}
      ${gpsLine()}`;
  }
  function renderLegend() {
    const L = layerOf(); const el = $('#legend');
    el.hidden = !S.legendOpen; $('#btnLegend').setAttribute('aria-pressed', String(S.legendOpen));
    if (!L || !S.legendOpen) return;
    el.innerHTML = L.legend.map((it) => `<div class="li"><span class="sw" style="background:${it.color}"></span><span>${esc(it.label)}</span><span class="pct">${esc(it.pct)}</span></div>`).join('') +
      `<div class="lst">${esc(L.label)} · média ${fmt(L.stats.mean, L.dec)} · mín ${fmt(L.stats.min, L.dec)} · máx ${fmt(L.stats.max, L.dec)}${L.metodo ? ' · ' + esc(L.metodo) : ''}${L.sum ? ` · total ${fmt(L.sum.totalT, 2)} t` : ''}</div>`;
  }

  // ------------------------------------------------------------------ GPS
  let gpsStarted = false;
  function startGps() {
    if (gpsStarted) return;
    gpsStarted = CP.gps.start(onFix, (msg) => { S.gpsMsg = msg; updateFabs(); renderReadout(); });
    CP.gps.startCompass();
  }
  function onFix(f) {
    S.fix = f; S.gpsMsg = '';
    if (S.map && S.area) {
      S.map.setPosition({ lon: f.lon, lat: f.lat, acc: f.acc, heading: f.heading, stale: false });
      if (S.follow) {
        // primeira posição dentro da área: aproxima para ~1 m por pixel (a tela mostra uns 400 m)
        let res;
        if (!S.zoomed && CP.readAt(S.area, layerOf() || S.area.layers[0], f.lon, f.lat).inside && S.map.metersPerPixel() > 1.5) { res = S.map.view.res / S.map.metersPerPixel(); S.zoomed = true; }
        S.map.centerOn(f.lon, f.lat, res);
      }
    }
    updateFabs(); renderReadout();
  }
  setInterval(() => { if (S.fix && S.map && S.screen === 'mapa') { S.map.setPosition({ lon: S.fix.lon, lat: S.fix.lat, acc: S.fix.acc, heading: S.fix.heading, stale: CP.gps.stale() }); renderReadout(); } }, 5000);

  // ------------------------------------------------------------------ anotações
  let fotoBlob = null, fotoThumb = null;
  async function shrinkPhoto(file) {
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
    const draw = (max, q) => { const k = Math.min(1, max / Math.max(bmp.width, bmp.height)); const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); return new Promise((res) => c.toBlob(res, 'image/jpeg', q)); };
    const blob = await draw(1600, 0.82);
    const thumbBlob = await draw(240, 0.7);
    const thumb = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(thumbBlob); });
    return { blob, thumb };
  }
  function openNota() {
    const a = S.area, L = layerOf(); if (!a) return;
    const f = S.fix;
    let lon, lat, acc, fonte;
    if (f && !CP.gps.stale()) { lon = f.lon; lat = f.lat; acc = f.acc; fonte = 'gps'; }
    else if (S.map && S.map.view) { const ll = RE.mercToLonLat(S.map.view.cx, S.map.view.cy); lon = ll[0]; lat = ll[1]; acc = null; fonte = 'centro do mapa'; }
    else { CP.toast('Sem posição ainda. Aguarde o GPS.'); return; }
    const r = L ? CP.readAt(a, L, lon, lat) : null;
    S.notaDraft = { lon, lat, acc, fonte, layerId: L ? L.id : null, valor: r && r.inside ? r.value : null, classe: r && r.inside ? r.range : null };
    fotoBlob = null; fotoThumb = null;
    $('#notaPos').textContent = `${fonte === 'gps' ? `GPS ±${fmt(acc, 0)} m` : 'Posição do centro do mapa (sem GPS)'} · ${lat.toFixed(6)}, ${lon.toFixed(6)}${L && r && r.inside && r.value != null ? ` · ${L.short} ${fmt(r.value, L.dec)} ${L.unit}` : ''}`;
    $('#notaTexto').value = ''; $('#notaFotoTxt').textContent = 'sem foto'; $('#notaPreview').hidden = true; $('#notaFoto').value = '';
    $('#dlgNota').showModal();
  }
  async function saveNota() {
    const d = S.notaDraft; if (!d) return;
    const L = layerOf();
    const [x, y] = RE.lonLatToUTM(d.lon, d.lat, S.area.zone, S.area.south);
    const n = { id: 'nota_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36), areaId: S.area.id, t: new Date().toISOString(), lon: d.lon, lat: d.lat, acc: d.acc, fonte: d.fonte, utm: { x, y, zone: S.area.zone }, camada: L ? { id: L.id, label: L.label, short: L.short, unit: L.unit, dec: L.dec } : null, valor: d.valor, classe: d.classe, texto: $('#notaTexto').value.trim(), foto: fotoBlob, thumb: fotoThumb };
    await CP.db.putNota(n);
    S.notas = await CP.db.listNotas(S.area.id);
    if (S.map) S.map.setMarks(S.notas.map((m, i) => ({ lon: m.lon, lat: m.lat, label: i + 1 })));
    CP.toast(`Anotação ${S.notas.length} salva.`);
  }
  async function renderNotas() {
    const el = $('#scr-notas'); const a = S.area;
    if (!a) { el.innerHTML = '<div class="pad"><div class="empty"><div class="big">Abra uma área</div></div></div>'; return; }
    S.notas = await CP.db.listNotas(a.id);
    const cards = S.notas.map((n, i) => `<div class="card nota">
        ${n.thumb ? `<img src="${n.thumb}" alt="foto">` : '<div class="noimg">sem foto</div>'}
        <div><div class="t"><b>#${i + 1}</b> · ${esc(dateTxt(n.t))} · ${n.acc != null ? '±' + fmt(n.acc, 0) + ' m' : esc(n.fonte)}</div>
          ${n.camada ? `<div class="v">${esc(n.camada.short)}: <b>${n.valor == null ? '—' : fmt(n.valor, n.camada.dec)}</b> ${esc(n.camada.unit)}${n.classe ? ' · classe ' + esc(n.classe) : ''}</div>` : ''}
          <div class="txt">${esc(n.texto) || '<span class="hint">(sem texto)</span>'}</div>
          <div class="row"><button class="btn small" data-act="ver" data-id="${n.id}">Ver no mapa</button><button class="btn small danger" data-act="del" data-id="${n.id}">Excluir</button></div>
        </div></div>`).join('');
    el.innerHTML = `<div class="pad">
      <div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>Anotações · ${S.notas.length}</h2><button class="btn primary" id="btnExport" ${S.notas.length ? '' : 'disabled'}>Exportar</button></div>
      <p class="hint" style="margin-bottom:12px">O arquivo exportado (.zip) tem as anotações em JSON, CSV e KML e as fotos. Arraste-o na plataforma para ver as observações sobre o mapa; renomeado para .kmz, abre no Google Earth com as fotos.</p>
      ${cards || '<div class="empty"><div class="big">Nenhuma anotação</div><p>No mapa, toque em <b>Anotar aqui</b> para registrar o que vê no lugar em que está.</p></div>'}
    </div>`;
    const bx = $('#btnExport'); if (bx) bx.onclick = exportNotas;
    el.querySelectorAll('[data-act="del"]').forEach((b) => { b.onclick = async () => { if (!confirm('Excluir esta anotação?')) return; await CP.db.delNota(b.dataset.id); renderNotas(); S.notas = await CP.db.listNotas(a.id); if (S.map) S.map.setMarks(S.notas.map((m, i) => ({ lon: m.lon, lat: m.lat, label: i + 1 }))); }; });
    el.querySelectorAll('[data-act="ver"]').forEach((b) => { b.onclick = () => { const n = S.notas.find((m) => m.id === b.dataset.id); if (!n) return; S.follow = false; go('mapa'); S.map.centerOn(n.lon, n.lat); updateFabs(); }; });
  }
  async function exportNotas() {
    const a = S.area, notas = S.notas; if (!notas.length) return;
    busy('Montando o arquivo…', 0.3);
    try {
      const z = new JSZip();
      const slug = (s) => RE.ascii(String(s || '')).replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 40);
      const rows = [];
      const items = [];
      let k = 0;
      for (const n of notas) {
        k++;
        const foto = n.foto ? `fotos/nota_${k}.jpg` : null;
        if (n.foto) z.file(foto, await n.foto.arrayBuffer());
        items.push({ n: k, id: n.id, dataHora: n.t, latitude: n.lat, longitude: n.lon, precisaoM: n.acc, fonte: n.fonte, utm: n.utm, camada: n.camada ? { id: n.camada.id, label: n.camada.label, unit: n.camada.unit } : null, valorMapa: n.valor, classe: n.classe, texto: n.texto, foto, thumb: n.thumb || null });
        rows.push([k, n.t, n.lat, n.lon, n.acc == null ? null : Math.round(n.acc), Math.round(n.utm.x), Math.round(n.utm.y), n.utm.zone + 'S', n.camada ? n.camada.label : '', n.valor == null ? null : +n.valor.toFixed(n.camada ? n.camada.dec : 2), n.classe || '', n.texto, foto || '']);
      }
      z.file('anotacoes_campo.json', JSON.stringify({ app: 'modo-campo', versao: CP.VERSAO, exportadoEm: new Date().toISOString(), area: { id: a.id, nome: a.nome, job: a.job, areaHa: a.areaHa, zone: a.zone, south: a.south }, notas: items }, null, 1));
      z.file('anotacoes.csv', '﻿' + RE.toDelimited(['n', 'data_hora', 'latitude', 'longitude', 'precisao_m', 'utm_x', 'utm_y', 'zona', 'camada', 'valor_mapa', 'classe', 'texto', 'foto'], rows, { sep: ';', dec: ',' }));
      const marks = items.map((it) => RE.kmlPoint({ name: `Anotação ${it.n}`, lon: it.longitude, lat: it.latitude, description: `${esc(dateTxt(it.dataHora))}${it.camada ? `<br>${esc(it.camada.label)}: <b>${it.valorMapa == null ? '—' : fmt(it.valorMapa, 2)}</b> ${esc(it.camada.unit)}` : ''}<br>${esc(it.texto)}${it.foto ? `<br><img src="${it.foto}" width="400">` : ''}` }));
      z.file('doc.kml', RE.kmlDocument(`Anotações · ${a.nome}`, RE.kmlFolder('Anotações de campo', true, marks.join(''))));
      const blob = await z.generateAsync({ type: 'blob', compression: 'DEFLATE' });
      const name = `anotacoes_${slug(a.job.talhao || a.nome)}_${new Date().toISOString().slice(0, 10)}.zip`;
      busy(null);
      const file = new File([blob], name, { type: 'application/zip' });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: 'Anotações de campo', text: a.nome }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
      }
      const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = name; document.body.appendChild(link); link.click();
      setTimeout(() => { URL.revokeObjectURL(url); link.remove(); }, 2000);
      CP.toast('Arquivo pronto: ' + name, 5000);
    } catch (e) { busy(null); console.error(e); CP.toast('Erro ao exportar: ' + e.message, 7000); }
  }

  // ------------------------------------------------------------------ sobre
  function renderSobre() {
    const a = S.area;
    $('#scr-sobre').innerHTML = `<div class="pad about">
      <div class="card"><h2>Modo Campo ${esc(CP.VERSAO)}</h2><p class="hint">Prescrição de Fertilidade · uma nova plataforma · by Wildonvay Balieiro Filho</p>
        <p style="margin-top:8px">Leva ao campo os mapas de fertilidade e de prescrição feitos na plataforma. O GPS do celular mostra onde você está sobre o mapa e lê o valor e a classe do atributo naquele ponto, para comparar com a lavoura.</p>

        ${a.autor && a.autor.nome ? `<p class="hint" style="margin-top:8px">Responsável: ${esc(a.autor.nome)}${a.autor.empresa ? ' · ' + esc(a.autor.empresa) : ''}</p>` : ''}</div>` : ''}
      <div class="card"><h3>Precisão</h3><p>O GPS do celular tem erro de 2 a 5 m em campo aberto (o círculo verde mostra a precisão informada pelo aparelho). A malha do mapa tem células de ${a ? a.cell : 10} m, feitas a partir de amostras a cada ~1 ha, então o GPS é mais fino que o mapa.</p></div>
      <div class="card"><h3>Instalar como aplicativo</h3><p>Android (Chrome): menu ⋮ → <b>Adicionar à tela inicial</b> / Instalar app. iPhone (Safari): compartilhar → <b>Adicionar à Tela de Início</b>. O ícone abre em tela cheia e sem internet.</p></div>
    </div>`;
  }

  // ------------------------------------------------------------------ inicialização
  async function init() {
    if (window.BRAND) { $('#logo').innerHTML = BRAND.logoSVG(38, 'top'); $('#busyLogo').innerHTML = BRAND.logoFullSVG(120, 'busy'); }
    document.querySelectorAll('#tabs .ic').forEach((el) => { el.innerHTML = IC[el.dataset.ic] || ''; });
    $('#btnLocate').innerHTML = IC.locate; $('#btnSat').innerHTML = IC.sat; $('#btnFit').innerHTML = IC.fit;
    document.querySelectorAll('#tabs button').forEach((b) => { b.onclick = () => { if (!b.disabled) go(b.dataset.scr); }; });
    $('#inFile').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
    $('#btnLocate').onclick = async () => {
      startGps(); await CP.gps.startCompass();
      if (CP.gps.permission === 'negada') { CP.toast('Permissão de localização negada. Libere nas configurações do navegador/app.', 6000); return; }
      S.follow = true; updateFabs();
      if (S.fix && S.map) { S.map.centerOn(S.fix.lon, S.fix.lat); if (S.map.metersPerPixel() > 1.2) S.map.centerOn(S.fix.lon, S.fix.lat, S.map.view.res * 0.5); }
      else CP.toast('Procurando o sinal do GPS…');
    };
    $('#btnSat').onclick = () => { S.sat = !S.sat; $('#btnSat').setAttribute('aria-pressed', String(S.sat)); if (S.map) S.map.setSatellite(S.sat); CP.db.setConfig('sat', S.sat); if (S.sat && !navigator.onLine) CP.toast('Sem conexão: só aparece a imagem já vista antes.'); };
    $('#btnFit').onclick = () => { S.follow = false; updateFabs(); if (S.map) S.map.fit(); };
    $('#btnZoomIn').onclick = () => S.map && S.map.zoom(1 / 1.5);
    $('#btnZoomOut').onclick = () => S.map && S.map.zoom(1.5);
    $('#btnLegend').onclick = () => { S.legendOpen = !S.legendOpen; renderLegend(); };
    $('#btnNota').onclick = openNota;
    $('#notaCancel').onclick = () => $('#dlgNota').close();
    $('#notaFoto').addEventListener('change', async (e) => {
      const f = e.target.files[0]; if (!f) return;
      $('#notaFotoTxt').textContent = 'processando…';
      try { const r = await shrinkPhoto(f); fotoBlob = r.blob; fotoThumb = r.thumb; $('#notaPreview').src = r.thumb; $('#notaPreview').hidden = false; $('#notaFotoTxt').textContent = `foto (${Math.round(r.blob.size / 1024)} KB)`; }
      catch (err) { $('#notaFotoTxt').textContent = 'não consegui ler a foto'; }
    });
    $('#formNota').addEventListener('submit', (e) => { e.preventDefault(); saveNota().then(() => $('#dlgNota').close()); });
    window.addEventListener('online', () => { if (S.map) S.map.render(); });
    S.sat = await CP.db.getConfig('sat', navigator.onLine);
    // service worker (uso sem sinal)
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      try {
        const reg = await navigator.serviceWorker.register('./sw.js');
        reg.addEventListener('updatefound', () => { const w = reg.installing; if (!w) return; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) CP.toast('Nova versão pronta: feche e abra o app para atualizar.', 7000); }); });
      } catch (e) { console.warn('sw', e); }
    }
    // reabre a última área direto no mapa; sem área, mostra a lista
    const last = await CP.db.getConfig('lastArea', null);
    const a = last ? await CP.db.getArea(last) : null;
    if (a) await openArea(a.id, true); else go('areas');
  }
  init();
})();

/* Modo Campo · service worker: o app funciona sem sinal (cache do próprio app) e guarda as imagens
   de satélite e fontes já vistas. A versão muda a cada build para o app atualizar. */
const VERSAO = '__VERSAO__';
const CACHE_APP = 'modo-campo-app-' + VERSAO;
const CACHE_RT = 'modo-campo-runtime';
const APP_FILES = ['./', './index.html', './manifest.webmanifest', './icon-192.png', './icon-512.png', './icon-maskable-512.png', './apple-touch-icon.png'];
const RT_MAX = 2500; // itens guardados (imagens de satélite e fontes)

self.addEventListener('install', (e) => {
  e.waitUntil(caches.open(CACHE_APP).then((c) => c.addAll(APP_FILES)).then(() => self.skipWaiting()));
});
self.addEventListener('activate', (e) => {
  e.waitUntil(caches.keys().then((keys) => Promise.all(keys.filter((k) => k.startsWith('modo-campo-app-') && k !== CACHE_APP).map((k) => caches.delete(k)))).then(() => self.clients.claim()));
});

async function trim(cache) {
  const keys = await cache.keys();
  if (keys.length > RT_MAX) for (const k of keys.slice(0, keys.length - RT_MAX)) await cache.delete(k);
}

self.addEventListener('fetch', (e) => {
  const req = e.request;
  if (req.method !== 'GET') return;
  const url = new URL(req.url);
  const same = url.origin === self.location.origin;
  if (same) {
    // app: cache primeiro; atualiza em segundo plano
    e.respondWith(caches.open(CACHE_APP).then(async (c) => {
      const hit = await c.match(req, { ignoreSearch: true });
      const net = fetch(req).then((r) => { if (r && r.ok) c.put(req, r.clone()); return r; }).catch(() => null);
      return hit || (await net) || new Response('Sem conexão e sem cópia guardada.', { status: 503 });
    }));
    return;
  }
  const isTile = /arcgisonline\.com/.test(url.host), isFont = /fonts\.(googleapis|gstatic)\.com/.test(url.host);
  if (!isTile && !isFont) return;
  // imagens de satélite e fontes: rede primeiro (imagem atual), cache como reserva sem sinal
  e.respondWith(caches.open(CACHE_RT).then(async (c) => {
    try {
      const r = await fetch(req);
      if (r && (r.ok || r.type === 'opaque')) { c.put(req, r.clone()); trim(c); }
      return r;
    } catch (err) {
      const hit = await c.match(req);
      return hit || new Response('', { status: 504 });
    }
  }));
});

</script>
