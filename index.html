<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Modo Campo · Prescrição de Fertilidade</title>
<meta name="description" content="Mapas de fertilidade e prescrição no campo, com a posição do GPS — Prescrição de Fertilidade, by Wildonvay Balieiro Filho">
<meta name="theme-color" content="#0b3a2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Modo Campo">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Modo Campo: mesma paleta "Campo" da plataforma, em tela cheia de celular (mapa + gaveta inferior). */
:root {
  --bg: #f1f4ee; --surface: #ffffff; --surface-2: #e9eee6; --surface-3: #dde4d8;
  --ink: #14211a; --ink-2: #44524a; --muted: #6d7b72; --line: #d3dbd0; --line-strong: #b4c0b2;
  --accent: #11573f; --accent-ink: #ffffff; --accent-soft: #dcefe3; --accent-line: #a9d3bb; --gold: #f0c350;
  --ok: #17784f; --ok-soft: #def2e6; --warn: #9a5b06; --warn-soft: #fbf0db; --bad: #b3261e; --bad-soft: #fbe5e3;
  --map-bg: #e6ebe3; --map-ink: #16201a;
  --brand-900: #0b3a2b; --brand-700: #11573f; --brand-500: #1c8a5b; --on-brand: #ffffff; --on-brand-soft: rgba(255,255,255,.74);
  --shadow: 0 1px 2px rgba(20,40,28,.08), 0 6px 18px rgba(20,40,28,.12);
  --f-display: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 12px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1310; --surface: #131c18; --surface-2: #1a2520; --surface-3: #22302a;
    --ink: #e5ece7; --ink-2: #b5c3ba; --muted: #8a9a90; --line: #26322c; --line-strong: #3a4a41;
    --accent: #62cf98; --accent-ink: #06261a; --accent-soft: #173527; --accent-line: #2c5a43;
    --ok: #62cf98; --ok-soft: #173527; --warn: #f0b85c; --warn-soft: #33270f; --bad: #f2867c; --bad-soft: #3a1714;
    --map-bg: #182019; --map-ink: #eef2ee;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
body { font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; letter-spacing: .005em; }
h2 { font-size: 1.35rem; } h3 { font-size: 1.1rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.hint { color: var(--muted); font-size: .86rem; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

#app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
.top { background: linear-gradient(135deg, var(--brand-900), var(--brand-700) 70%, #1c7a55); color: var(--on-brand); padding: calc(var(--sat) + 8px) 14px 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .logo { width: 38px; height: 38px; display: block; flex: none; }
.brand .logo svg { width: 38px; height: 38px; display: block; }
.brand .bt { display: flex; flex-direction: column; line-height: 1.15; }
.brand b { font-family: var(--f-display); font-size: 1.15rem; font-weight: 600; }
.brand small { color: var(--on-brand-soft); font-size: .72rem; white-space: nowrap; }
.topctx { font-size: .8rem; text-align: right; color: var(--on-brand-soft); min-width: 0; max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topctx b { color: var(--on-brand); display: block; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; }

main { flex: 1; min-height: 0; position: relative; }
.scr { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
#scr-mapa { display: flex; flex-direction: column; overflow: hidden; }
.pad { padding: 14px; }

/* ---- barra de abas ---- */
.tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: var(--sab); }
.tabs button { background: none; border: 0; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .72rem; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--accent); font-weight: 600; }
.tabs button:disabled { opacity: .35; }
.tabs .ic { width: 22px; height: 22px; display: block; }
.tabs .ic svg { width: 22px; height: 22px; display: block; }

/* ---- botões ---- */
.btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad-soft); background: var(--bad-soft); }
.btn.small { min-height: 36px; padding: 6px 10px; font-size: .88rem; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }

/* ---- áreas ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); margin-bottom: 12px; }
.card h3 { margin-bottom: 4px; }
.card .meta { color: var(--muted); font-size: .85rem; }
.card .acts { display: flex; gap: 8px; margin-top: 10px; }
.card.open-area { border-color: var(--accent-line); background: var(--accent-soft); }
.empty { text-align: center; padding: 30px 14px; color: var(--ink-2); }
.empty .big { font-family: var(--f-display); font-size: 1.3rem; color: var(--ink); margin-bottom: 6px; }
.steps { counter-reset: s; padding-left: 0; list-style: none; margin: 10px 0 0; }
.steps li { position: relative; padding-left: 34px; margin-bottom: 8px; }
.steps li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 1px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: .8rem; display: grid; place-items: center; }

/* ---- mapa ---- */
.mapwrap { flex: 1; min-height: 0; position: relative; }
#map { position: absolute; inset: 0; background: var(--map-bg); }
.mapbox { position: relative; overflow: hidden; }
.mapbox canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.mapbox canvas.drag { cursor: grabbing; }
.map-tip { display: none; }
.map-note { position: absolute; left: 8px; bottom: 34px; background: rgba(255,255,255,.85); color: #16201a; font-size: .72rem; padding: 2px 6px; border-radius: 6px; max-width: 70%; }
.fab-col { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 8px; }
.fab { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 1.3rem; font-weight: 500; }
.fab svg { width: 22px; height: 22px; }
.fab[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.fab.follow { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.fab.warn { background: var(--warn-soft); color: var(--warn); }
.probe { position: absolute; left: 10px; top: 10px; max-width: calc(100% - 70px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 8px 10px; font-size: .85rem; }
.probe b { font-size: 1rem; }
.probe .x { float: right; border: 0; background: none; font-size: 1.1rem; line-height: 1; padding: 0 0 0 10px; color: var(--muted); }

/* ---- gaveta inferior ---- */
.sheet { flex: none; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 12px 10px; box-shadow: 0 -4px 16px rgba(0,0,0,.08); max-height: 52%; overflow: auto; }
.groups { display: flex; gap: 6px; margin-bottom: 6px; }
.groups button { flex: 1; border: 0; background: var(--surface-2); color: var(--ink-2); border-radius: 8px; padding: 6px 4px; font-size: .78rem; font-weight: 600; }
.groups button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .86rem; white-space: nowrap; }
.chips button[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.readout { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; min-height: 64px; }
.readout .val { font-family: var(--f-display); font-size: 2.3rem; font-weight: 600; line-height: 1; display: flex; align-items: baseline; gap: 6px; }
.readout .val small { font-size: .95rem; color: var(--muted); font-family: var(--f-body); font-weight: 500; }
.readout .sw { width: 100%; height: 10px; border-radius: 5px; border: 1px solid rgba(0,0,0,.15); }
.readout .cls { font-size: .88rem; color: var(--ink-2); }
.readout .gps { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.readout .gps .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); margin-right: 3px; }
.readout .gps .dot.off { background: var(--bad); }
.readout .gps .dot.old { background: var(--warn); }
.readout .near { grid-column: 1 / -1; font-size: .85rem; color: var(--ink-2); }
.readout .big-msg { grid-column: 1 / -1; font-family: var(--f-display); font-size: 1.2rem; color: var(--ink-2); }
.legend { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.legend .li { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; font-size: .84rem; padding: 2px 0; }
.legend .sw { height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); }
.legend .pct { color: var(--muted); }
.legend .lst { font-size: .78rem; color: var(--muted); margin-top: 4px; }
.sheet-actions { display: flex; gap: 8px; margin-top: 8px; }
.sheet-actions .btn { flex: 1; }

/* ---- anotações ---- */
.nota { display: grid; grid-template-columns: 84px 1fr; gap: 12px; }
.nota img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; background: var(--surface-2); }
.nota .noimg { width: 84px; height: 84px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-size: .75rem; }
.nota .t { font-size: .8rem; color: var(--muted); }
.nota .v { font-size: .85rem; color: var(--ink-2); }
.nota .txt { margin: 4px 0; }

/* ---- diálogo ---- */
dialog { border: 0; border-radius: 14px; padding: 0; max-width: 520px; width: calc(100% - 28px); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog form { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.f { display: flex; flex-direction: column; gap: 4px; }
.f > span { font-size: .85rem; color: var(--ink-2); }
textarea, input[type="text"] { border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px; background: var(--bg); width: 100%; }
#notaPreview { width: 100%; max-height: 220px; object-fit: contain; border-radius: 10px; background: var(--surface-2); }

/* ---- ocupado e aviso ---- */
.busy { position: fixed; inset: 0; background: rgba(11,58,43,.85); display: grid; place-items: center; z-index: 20; color: #fff; }
.busy .card { background: transparent; border: 0; box-shadow: none; text-align: center; width: min(90%, 360px); color: #fff; }
.busy .logo { width: 120px; margin: 0 auto 10px; }
.busy .bar { height: 8px; background: rgba(255,255,255,.25); border-radius: 4px; overflow: hidden; margin-top: 12px; }
.busy .bar > div { height: 100%; width: 0; background: var(--gold); transition: width .2s; }
.toast { position: fixed; left: 50%; bottom: calc(var(--sab) + 74px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: .9rem; max-width: 92%; z-index: 30; box-shadow: var(--shadow); }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: .86rem; margin-bottom: 10px; }
.about p { margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: .88rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }

</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="logo" id="logo"></span><div class="bt"><b>Modo Campo</b><small>Prescrição de Fertilidade</small></div></div>
    <div class="topctx" id="topCtx"></div>
  </header>
  <main id="main">
    <section class="scr" id="scr-areas"></section>
    <section class="scr" id="scr-mapa" hidden>
      <div class="mapwrap"><div id="map"></div>
        <div class="fab-col">
          <button class="fab" id="btnLocate" title="Minha posição" aria-label="Minha posição"></button>
          <button class="fab" id="btnSat" title="Satélite" aria-label="Fundo de satélite" aria-pressed="false"></button>
          <button class="fab" id="btnFit" title="Enquadrar a área" aria-label="Enquadrar a área"></button>
          <button class="fab" id="btnZoomIn" aria-label="Aproximar">+</button>
          <button class="fab" id="btnZoomOut" aria-label="Afastar">−</button>
        </div>
        <div class="probe" id="probe" hidden></div>
      </div>
      <div class="sheet" id="sheet">
        <div class="groups" id="groups"></div>
        <div class="chips" id="chips"></div>
        <div class="readout" id="readout"></div>
        <div class="sheet-actions">
          <button class="btn primary" id="btnNota">Anotar aqui</button>
          <button class="btn" id="btnLegend" aria-pressed="false">Legenda</button>
        </div>
        <div class="legend" id="legend" hidden></div>
      </div>
    </section>
    <section class="scr" id="scr-notas" hidden></section>
    <section class="scr" id="scr-sobre" hidden></section>
  </main>
  <nav class="tabs" id="tabs">
    <button data-scr="areas" aria-selected="true"><span class="ic" data-ic="areas"></span>Áreas</button>
    <button data-scr="mapa" aria-selected="false" disabled><span class="ic" data-ic="mapa"></span>Mapa</button>
    <button data-scr="notas" aria-selected="false" disabled><span class="ic" data-ic="notas"></span>Anotações</button>
    <button data-scr="sobre" aria-selected="false"><span class="ic" data-ic="sobre"></span>Sobre</button>
  </nav>
  <input type="file" id="inFile" accept=".json,application/json" hidden>
  <dialog id="dlgNota">
    <form method="dialog" id="formNota">
      <h3>Anotação de campo</h3>
      <p class="hint" id="notaPos"></p>
      <label class="f"><span>O que você está vendo</span><textarea id="notaTexto" rows="4" placeholder="Ex.: plantas menores e amareladas nesta faixa; coincide com Mg baixo no mapa"></textarea></label>
      <div class="row">
        <label class="btn" for="notaFoto">Tirar foto</label><input type="file" id="notaFoto" accept="image/*" capture="environment" hidden>
        <span class="hint" id="notaFotoTxt">sem foto</span>
      </div>
      <img id="notaPreview" alt="" hidden>
      <div class="row end">
        <button type="button" class="btn" id="notaCancel">Cancelar</button>
        <button type="submit" class="btn primary" id="notaSave">Salvar</button>
      </div>
    </form>
  </dialog>
  <div class="busy" id="busy" hidden><div class="card"><div class="logo" id="busyLogo"></div><p id="busyTxt">Calculando…</p><div class="bar"><div id="busyBar"></div></div></div></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

/* =====================================================================
 * Prescrição de Fertilidade — motor de cálculo (puro, sem DOM)
 * Módulo 00: utilitários numéricos e de texto
 * ===================================================================== */
(function (root) {
  'use strict';
  const RE = root.RE || (root.RE = {});

  /** Remove acentos e normaliza espaços — usado para casar cabeçalhos. */
  RE.fold = function fold(s) {
    return String(s == null ? '' : s)
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[¹²³]/g, (c) => ({ '¹': '1', '²': '2', '³': '3' }[c]))
      .replace(/\s+/g, ' ').trim().toLowerCase();

    return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7e]/g, '');
  };

    if (!s) return null;

  RE.normDepth = function normDepth(v) {

  /** Fatoração LU com pivoteamento parcial (in-place). */
  function luDecompose(A, n) {

    for (let i = 0; i < n; i++) piv[i] = i;
    for (let k = 0; k < n; k++) {
      let p = k, maxv = Math.abs(A[k * n + k]);
      for (let i = k + 1; i < n; i++) { const v = Math.abs(A[i * n + k]); if (v > maxv) { maxv = v; p = i; } }
      if (maxv < 1e-14) throw new Error('Matriz singular na krigagem (pontos duplicados?)');

        for (let j = 0; j < n; j++) { const t = A[k * n + j]; A[k * n + j] = A[p * n + j]; A[p * n + j] = t; }
        const t = piv[k]; piv[k] = piv[p]; piv[p] = t;
      }
      for (let i = k + 1; i < n; i++) {
        const f = (A[i * n + k] /= A[k * n + k]);
        if (f !== 0) for (let j = k + 1; j < n; j++) A[i * n + j] -= f * A[k * n + j];

    for (let i = 0; i < n; i++) x[i] = b[piv[i]];

    for (let i = n - 1; i >= 0; i--) { for (let j = i + 1; j < n; j++) x[i] -= A[i * n + j] * x[j]; x[i] /= A[i * n + i]; }

      else { V[k] = (V[k] * C[k] + vals[i]) / (C[k] + 1); C[k]++; }

    }

    const piv = luDecompose(A, N);
    const b = new Float64Array(N); for (let i = 0; i < n; i++) b[i] = vals[i];
    const w = luSolve(A, piv, b, N);

      for (let i = 0; i < n; i++) {

    const xs = pts.map((q) => q[0]), ys = pts.map((q) => q[1]);

  'use strict';
  const RE = root.RE;
  const fmt = RE.fmt;
  const ok = (x) => x != null && Number.isFinite(x);

  /** Média, mínimo e máximo dos valores válidos. */
  function stat(arr) {
    let n = 0, s = 0, mn = Infinity, mx = -Infinity;
    if (arr) for (let i = 0; i < arr.length; i++) { const v = arr[i]; if (!ok(v)) continue; n++; s += v; if (v < mn) mn = v; if (v > mx) mx = v; }
    return { n, mean: n ? s / n : null, min: n ? mn : null, max: n ? mx : null };
  }
  /** % das células válidas (em `arr`) em que pred(v, i) é verdadeiro. */
  function share(arr, pred) {
    let n = 0, k = 0;
    if (arr) for (let i = 0; i < arr.length; i++) { const v = arr[i]; if (!ok(v)) continue; n++; if (pred(v, i)) k++; }
    return n ? (k / n) * 100 : null;
  }
  /** Média de f(i) nas células em que a dose final é > 0. */
  function meanApplied(rates, f) {
    let n = 0, s = 0;
    for (let i = 0; i < rates.length; i++) { const r = rates[i]; if (!ok(r) || r <= 0) continue; const v = f(i, r); if (!ok(v)) continue; n++; s += v; }
    return n ? s / n : null;
  }
  const pc = (x) => (x == null ? '—' : fmt(x, 0) + '%');
  const rng = (s, d, u) => (s.n ? `${fmt(s.min, d)}–${fmt(s.max, d)}${u ? ' ' + u : ''}` : '—');
  const nivel = (below) => (below == null ? null : below > 50 ? 'low' : below > 10 ? 'mid' : 'ok');

  /** Estilo de cada camada: grupo de cor do módulo e símbolo do elemento. */
  const MOD = { cal: 'cal', calCa: 'cal', calMg: 'cal', gesso: 'ges', fos: 'fos', pot: 'pot', nitPl: 'nit', nitCob: 'nit', mS: 'mic', mB: 'mic', mZn: 'mic', mCu: 'mic', mMn: 'mic' };
  const ELEM = { cal: 'Ca·Mg', calCa: 'Ca', calMg: 'Mg', gesso: 'S', fos: 'P', pot: 'K', nitPl: 'N', nitCob: 'N', mS: 'S', mB: 'B', mZn: 'Zn', mCu: 'Cu', mMn: 'Mn' };
  RE.layerStyle = (id) => ({ mod: MOD[id] || 'mic', el: ELEM[id] || String(id) });
  RE.MOD_COLORS = { cal: '#b7791f', ges: '#5f78c9', fos: '#d4603a', pot: '#8a5cc9', nit: '#5b8c2a', mic: '#16958a' };

  const MICRO_NOME = { B: 'Boro', Zn: 'Zinco', Cu: 'Cobre', Mn: 'Manganês', S: 'Enxofre' };
  const EXTRATOR = { mehlich: 'Mehlich-1', dtpa: 'DTPA', resina: 'resina' };

  /**
   * Passa a recomendação em todas as células para guardar o diagnóstico de cada uma
   * (regra da calagem, critério do gesso, NC/CT do P, meta de K, classe dos micros, S de outros produtos).
   */
  RE.reportDiag = function (grid, sup, sub, crop, products) {
    const n = grid.idx.length;
    const o = {
      n, regra: new Array(n).fill(null), gesAplica: new Int8Array(n).fill(-1),
      fosNC: new Float32Array(n).fill(NaN), fosCT: new Float32Array(n).fill(NaN), fosManut: null,
      potAlvo: new Float32Array(n).fill(NaN), potManut: null,
      cls: {}, sOutros: new Float32Array(n).fill(NaN), sElem: new Float32Array(n).fill(NaN),
      nitTotal: new Float32Array(n).fill(NaN), nitAjuste: new Float32Array(n).fill(NaN), nitFos: new Float32Array(n).fill(NaN), nit: null,
    };
    for (const nu of ['S', 'B', 'Zn', 'Cu', 'Mn']) o.cls[nu] = new Int8Array(n).fill(-1);
    for (let q = 0; q < n; q++) {
      const v = RE.cellValues(sup.attrs, q);
      const vs = sub ? RE.cellValues(sub.attrs, q) : null;
      const d = RE.recommend(v, vs, crop, products).diag;
      if (d.cal && d.cal.ok && d.cal.regra) o.regra[q] = d.cal.regra;
      if (d.gesso) o.gesAplica[q] = d.gesso.aplica ? 1 : 0;
      if (d.fos && d.fos.ok) { o.fosNC[q] = d.fos.nc; o.fosCT[q] = d.fos.ct; o.fosManut = d.fos.manut; }
      if (d.pot && d.pot.ok) { o.potAlvo[q] = d.pot.alvoMg; o.potManut = d.pot.manut; }
      for (const nu of ['B', 'Zn', 'Cu', 'Mn', 'S']) { const r = d['m' + nu]; if (r && r.ok) o.cls[nu][q] = r.classe; }
      if (d.mS && d.mS.ok) { o.sOutros[q] = d.mS.sOutros || 0; o.sElem[q] = d.mS.elemento; }
      if (d.nit && d.nit.ok) { o.nitTotal[q] = d.nit.total; o.nitAjuste[q] = d.nit.ajuste; o.nitFos[q] = d.nit.nFos; o.nit = d.nit; }
    }
    return o;
  };

  /** Texto da distribuição de classes de um micronutriente (ou S) na área. */
  function classDist(cls) {
    let n = 0; const c = [0, 0, 0];
    for (let i = 0; i < cls.length; i++) if (cls[i] >= 0) { n++; c[cls[i]]++; }
    if (!n) return null;
    return { baixo: c[0] / n * 100, medio: c[1] / n * 100, alto: c[2] / n * 100 };
  }

  /**
   * Monta o resumo.
   * ctx: { grid, sup, sub, crop, products, defs (camadas ativas), raw {id: taxa bruta por célula},
   *        final {id: {cell, sum, budget, adj, kg}}, rules {id: regra}, orcGlobal, orcGlobalRes,
   *        meta {fazenda, talhao, ano, camadaSup, camadaSub, nSup, nSub, areaHa, celula, modo, interp},
   *        opts {custos, formulas, efeito, mapas} }
   */
  RE.buildReport = function (ctx) {
    const { grid, sup, sub, crop, defs, raw, final, rules } = ctx;
    const products = ctx.products;
    const opts = Object.assign({ custos: true, formulas: true, efeito: true, mapas: true }, ctx.opts || {});
    const PR = (id) => products.find((p) => p.id === id) || {};
    const A = sup.attrs, B = sub ? sub.attrs : null;
    const diag = RE.reportDiag(grid, sup, sub, crop, products);
    const cal = crop.calagem, ges = crop.gessagem, fo = crop.fosforo, po = crop.potassio, mic = crop.micros;
    const lim = RE.MICRO_CLASSES[mic.extrator] || RE.MICRO_CLASSES.mehlich;
    const yieldT = RE.yieldT(crop);
    const depthSub = (ctx.meta && ctx.meta.camadaSub) || '20–40';

    // ---------------------------------------------------------------- diagnóstico do talhão
    const diagnosis = [];
    const addRow = (key, arr, ref, below, extra) => {
      const s = stat(arr); if (!s.n) return;
      const at = RE.ATTR[key] || { label: key, unit: '', dec: 2 };
      diagnosis.push(Object.assign({ key, label: at.label, unit: at.unit, dec: at.dec, mean: s.mean, min: s.min, max: s.max, ref: ref || null, status: below == null ? null : `${pc(below)} da área abaixo`, level: nivel(below) }, extra || {}));
    };
    if (A.pH) addRow('pH', A.pH);
    else if (A.pHCa) addRow('pHCa', A.pHCa);
    addRow('V', A.V, cal.metodo === 'v' ? `meta ${fmt(cal.vAlvo, 0)}%` : null, cal.metodo === 'v' ? share(A.V, (v) => v < cal.vAlvo) : null);
    if (cal.metodo === 'caMg') {
      addRow('CaT', A.CaT, `meta ${fmt(cal.caAlvo, 1)}%`, share(A.CaT, (v) => v < cal.caAlvo));
      addRow('MgT', A.MgT, `meta ${fmt(cal.mgAlvo, 1)}%`, share(A.MgT, (v) => v < cal.mgAlvo));
    } else { addRow('Ca', A.Ca); addRow('Mg', A.Mg); }
    if (cal.metodo === 'al') {
      const s = stat(A.m); if (s.n) diagnosis.push({ key: 'm', label: RE.ATTR.m.label, unit: '%', dec: 1, mean: s.mean, min: s.min, max: s.max, ref: `máx. ${fmt(cal.mt, 0)}%`, status: `${pc(share(A.m, (v) => v > cal.mt))} da área acima`, level: nivel(share(A.m, (v) => v > cal.mt)) });
    }
    if (po.metodo === 'kctc') addRow('KT', A.KT, `meta ${fmt(po.kAlvo, 1)}%`, share(A.KT, (v) => v < po.kAlvo));
    else if (po.metodo === 'nc') addRow('K', A.K, `NC ${fmt(po.ncBaixa, 0)}/${fmt(po.ncAlta, 0)} mg/dm³`, share(A.K, (v, i) => ok(diag.potAlvo[i]) && v < diag.potAlvo[i]));
    else addRow('K', A.K);
    const pKey = fo.extrator === 'resina' ? 'PRes' : 'P';
    if (fo.metodo !== 'nenhum') {
      const nc = stat(diag.fosNC);
      addRow(pKey, A[pKey], nc.n ? (fo.metodo === 'fixo' ? `NC ${fmt(nc.mean, 0)} mg/dm³` : `NC ${fmt(nc.min, 0)}${nc.max > nc.min ? '–' + fmt(nc.max, 0) : ''} mg/dm³`) : null, nc.n ? share(A[pKey], (v, i) => ok(diag.fosNC[i]) && v < diag.fosNC[i]) : null);
    } else addRow(pKey, A[pKey]);
    for (const nu of ['S', 'B', 'Zn', 'Cu', 'Mn']) {
      if (!A[nu]) continue;
      const cd = classDist(diag.cls[nu]);
      const l = lim[nu];
      const s = stat(A[nu]);
      if (!s.n) continue;
      const at = RE.ATTR[nu];
      const lowPct = cd ? cd.baixo : share(A[nu], (v) => v <= l[0]);
      const midPct = cd ? cd.medio : share(A[nu], (v) => v > l[0] && v <= l[1]);
      diagnosis.push({ key: nu, label: at.label, unit: at.unit, dec: at.dec, mean: s.mean, min: s.min, max: s.max, ref: `adequado > ${fmt(l[1], nu === 'S' || nu === 'Mn' ? 1 : 2)}`, status: `baixo ${pc(lowPct)} · médio ${pc(midPct)}`, level: lowPct > 50 ? 'low' : lowPct + midPct > 50 ? 'mid' : 'ok' });
    }
    if (A.Arg) addRow('Arg', A.Arg);
    if (A.MO) addRow('MO', A.MO);
    if (B && ges.metodo !== 'nenhum') {
      const sCa = stat(B.Ca), sm = stat(B.m);
      if (sCa.n) diagnosis.push({ key: 'Ca_sub', label: `Cálcio em ${depthSub} cm`, unit: 'cmolc/dm³', dec: 2, mean: sCa.mean, min: sCa.min, max: sCa.max, ref: `gesso se ≤ ${fmt(ges.caMax, 1)}`, status: `${pc(share(B.Ca, (v) => v <= ges.caMax))} da área ≤ ${fmt(ges.caMax, 1)}`, level: nivel(share(B.Ca, (v) => v <= ges.caMax)) });
      if (sm.n) diagnosis.push({ key: 'm_sub', label: `m% em ${depthSub} cm`, unit: '%', dec: 1, mean: sm.mean, min: sm.min, max: sm.max, ref: `gesso se ≥ ${fmt(ges.mMin, 0)}%`, status: `${pc(share(B.m, (v) => v >= ges.mMin))} da área ≥ ${fmt(ges.mMin, 0)}%`, level: nivel(share(B.m, (v) => v >= ges.mMin)) });
    }

    // ---------------------------------------------------------------- regras aplicadas
    function regrasTxt(d) {
      const r = rules[d.id] || RE.DEFAULT_RULE();
      const F = final[d.id] || {};
      const lines = [];
      if (r.fixa != null && r.fixa !== '' && Number.isFinite(+r.fixa)) lines.push(`Taxa fixa de ${fmt(+r.fixa, 0)} kg/ha em toda a área (anula a taxa variável).`);
      else {
        if (+r.min > 0) lines.push(`Taxa mínima de ${fmt(+r.min, 0)} kg/ha: ${r.minModo === 'piso' ? 'piso em toda a área (garante a dose mínima mesmo onde o cálculo deu menos).' : r.minModo === 'elevar' ? 'doses entre zero e a mínima sobem até a mínima.' : 'doses abaixo dela são zeradas (a máquina não aplica menos que isso).'}`);
        if (+r.max > 0) lines.push(`Taxa máxima de ${fmt(+r.max, 0)} kg/ha.`);
        if (+r.passo > 0) lines.push(`Doses arredondadas a cada ${fmt(+r.passo, 0)} kg/ha (faixas de taxa).`);
        const b = F.budget;
        if (r.orc && r.orc.ativo && b) {
          const how = b.adj ? (b.adj.k != null ? `doses multiplicadas por ${fmt(b.adj.k, 3)}` : b.adj.c != null ? `desconto de ${fmt(b.adj.c, 0)} kg/ha em cada célula, preservando as áreas mais deficientes` : `teto de ${fmt(b.adj.cap, 0)} kg/ha`) : 'sem corte necessário';
          lines.push(`Orçamento de R$ ${fmt(+r.orc.alvo, 0)}/ha (${r.orc.modo === 'prioridade' ? 'priorizando as áreas mais deficientes' : r.orc.modo === 'teto' ? 'cortando os picos' : 'redução proporcional'}): R$ ${fmt(b.custoOriginal, 0)}/ha → R$ ${fmt(b.custo, 0)}/ha; ${how}.${b.atingivel ? '' : ' O orçamento ficou abaixo do mínimo possível com as regras atuais.'}`);
        }
      }
      if (F.kg != null && F.kg < 0.9999) lines.push(`Orçamento total de R$ ${fmt(+(ctx.orcGlobal || {}).alvo || 0, 0)}/ha para todos os produtos: doses variáveis × ${fmt(F.kg, 3)}.`);
      const rawS = stat(raw[d.id]), finS = F.sum;
      if (!lines.length) lines.push('Sem taxa mínima, máxima, arredondamento ou orçamento: cada célula recebe a dose calculada.');
      else if (rawS.n && finS && Math.abs(rawS.mean - finS.media) > 0.5) lines.push(`Efeito das regras: média calculada de ${fmt(rawS.mean, 0)} kg/ha → aplicada ${fmt(finS.media, 0)} kg/ha.`);
      return lines;
    }

    // ---------------------------------------------------------------- custos
    function custoTxt(d) {
      const s = (final[d.id] || {}).sum || {};
      const p = d.produto;
      if (!(p.preco > 0)) return ['Preço do produto não informado: sem custo calculado.'];
      return [`Preço de R$ ${fmt(p.preco, 2)}/t · custo médio de R$ ${fmt(s.custoHa, 2)}/ha · total de R$ ${fmt(s.custoTotal, 2)} para ${fmt(s.area, 2)} ha.`];
    }

    // ---------------------------------------------------------------- efeito: calagem (Ca e Mg na CTC depois)
    function calEffect() {
      if (!A.Ca || !A.Mg || !A.T) return null;
      const df = cal.prof / 10;
      const parts = [];
      const add = (layerId, prodId, ef) => {
        const F = final[layerId]; if (!F) return;
        const p = PR(prodId); const pr = Math.min(1, (p.PRNT || 100) / 100);
        parts.push({ cell: F.cell, pr, ef, CaO: p.CaO || 0, MgO: p.MgO || 0 });
      };
      if (defs.some((d) => d.id === 'cal')) add('cal', cal.produto, cal.metodo === 'caMg' ? cal.efic : (cal.eficV || 1));
      if (cal.metodo === 'caMg' && cal.compCa.ativo && defs.some((d) => d.id === 'calCa')) add('calCa', cal.compCa.produto, cal.compCa.efic);
      if (cal.metodo === 'caMg' && cal.compMg.ativo && defs.some((d) => d.id === 'calMg')) add('calMg', cal.compMg.produto, cal.compMg.efic);
      const n = grid.idx.length;
      const caT = new Float32Array(n).fill(NaN), mgT = new Float32Array(n).fill(NaN), vA = new Float32Array(n).fill(NaN);
      const fCal = final.cal, pCal = PR(cal.produto);
      for (let q = 0; q < n; q++) {
        const T = A.T[q], Ca = A.Ca[q], Mg = A.Mg[q];
        if (!ok(T) || !ok(Ca) || !ok(Mg) || T <= 0) continue;
        let ca = Ca, mg = Mg;
        for (const x of parts) { const dose = x.cell[q]; if (!ok(dose) || dose <= 0) continue; ca += dose * x.pr * x.ef * (x.CaO / 100) / 1.4 / 200.4 / df; mg += dose * x.pr * x.ef * (x.MgO / 100) * 0.6 / df / 120; }
        caT[q] = ca / T * 100; mgT[q] = mg / T * 100;
        // V%: pela própria fórmula do método (ΔV = NC × PRNT × eficiência / (T × prof/20))
        if (A.V && ok(A.V[q])) {
          const dose = fCal && ok(fCal.cell[q]) ? fCal.cell[q] : 0;
          vA[q] = cal.metodo === 'v' ? A.V[q] + (dose / 1000) * (pCal.PRNT || 100) * (cal.eficV || 1) / (T * cal.prof / 20) : A.V[q] + ((ca - Ca) + (mg - Mg)) / T * 100;
        }
      }
      const tol = cal.tol === 'custom'
        ? { caLo: cal.caAlvo * (1 - cal.tolCustom.caLo / 100), mgLo: cal.mgAlvo * (1 - cal.tolCustom.mgLo / 100) }
        : (() => { const t = RE.tolSheet(cal.caAlvo, cal.mgAlvo); return { caLo: t.caLo * 100, mgLo: t.mgLo * 100 }; })();
      return { caT: stat(caT), mgT: stat(mgT), vA: stat(vA), caOk: share(caT, (v) => v >= tol.caLo - 0.05), mgOk: share(mgT, (v) => v >= tol.mgLo - 0.05), caOk0: share(A.CaT, (v) => v >= tol.caLo - 0.05), mgOk0: share(A.MgT, (v) => v >= tol.mgLo - 0.05), tol };
    }

    // ---------------------------------------------------------------- páginas por aplicação
    const pages = [];
    const cE = opts.efeito && cal.metodo !== 'nenhum' ? calEffect() : null;
    for (const d of defs) {
      const F = final[d.id]; if (!F) continue;
      const s = F.sum;
      const ids = [d.id].concat(d.inclui || []);
      const pg = { id: d.id, style: RE.layerStyle(d.id), titulo: d.modulo, rotulo: d.rotulo, produto: d.produto.nome, objetivo: '', porque: [], metodo: '', formula: [], params: [], regras: regrasTxt(d), efeito: [], custo: opts.custos ? custoTxt(d) : [], sum: s, rawMean: stat(raw[d.id]).mean };
      const prod = d.produto;
      for (const id of ids) {
        if (id === 'cal') {
          if (cal.metodo === 'caMg') {
            const sCa = stat(A.CaT), sMg = stat(A.MgT), sV = stat(A.V);
            const n = diag.regra.filter(Boolean).length || 1;
            const cnt = (k) => diag.regra.filter((x) => x === k).length / n * 100;
            pg.objetivo = `Elevar Ca a ${fmt(cal.caAlvo, 0)}% e Mg a ${fmt(cal.mgAlvo, 0)}% da CTC`;
            pg.porque.push(`Ca na CTC: média de ${fmt(sCa.mean, 1)}% (${rng(sCa, 1, '%')}), meta de ${fmt(cal.caAlvo, 1)}%: ${pc(share(A.CaT, (v) => v < cal.caAlvo))} da área abaixo da meta.`);
            pg.porque.push(`Mg na CTC: média de ${fmt(sMg.mean, 1)}% (${rng(sMg, 1, '%')}), meta de ${fmt(cal.mgAlvo, 1)}%: ${pc(share(A.MgT, (v) => v < cal.mgAlvo))} da área abaixo da meta.`);
            if (sV.n) pg.porque.push(`Saturação por bases (V%) média de ${fmt(sV.mean, 1)}% (${rng(sV, 1, '%')}).`);
            pg.porque.push(`A dose foi definida pela meta de Ca em ${pc(cnt('Ca'))} da área e pela meta de Mg em ${pc(cnt('Mg'))}; ${pc(cnt('zero'))} da área já estava na faixa de tolerância e não recebe corretivo.`);
            pg.metodo = `Saturação de Ca e Mg na CTC (planilha de calagem Wehrmann, fórmulas ${cal.formula === 'legado' ? 'da versão anterior, 2022–2026' : 'do Modelo atual'}).`;
            if (opts.formulas) pg.formula = [
              'Dose p/ Ca (kg/ha) = (T × Ca% meta − Ca) × 200,4 × prof/10 × 1,4 × 100 / CaO% / PRNT / eficiência',
              'Dose p/ Mg (kg/ha) = (T × Mg% meta − Mg) × 121,56 × prof/10 × 1,67 / MgO% / PRNT / eficiência',
              'Usa a dose que leva Ca e Mg à faixa de tolerância; o que faltar vem das fontes complementares. PRNT limitado a 100%.',
            ];
            const tolTxt = cal.tol === 'custom' ? `Ca −${fmt(cal.tolCustom.caLo, 0)}/+${fmt(cal.tolCustom.caHi, 0)}%, Mg −${fmt(cal.tolCustom.mgLo, 0)}/+${fmt(cal.tolCustom.mgHi, 0)}%` : 'regra da planilha (Ca: −10/+5% acima de 60%, senão −5/+10%; Mg: ±10% acima de 19%, senão −10/+15%)';
            if (opts.formulas) pg.params.push(['Metas na CTC', `Ca ${fmt(cal.caAlvo, 1)}% · Mg ${fmt(cal.mgAlvo, 1)}%`], ['Tolerância', tolTxt], ['Camada corrigida', `0–${fmt(cal.prof, 0)} cm`], ['Eficiência', fmt(cal.efic, 2)], ['Corretivo', `${prod.nome}: CaO ${fmt(prod.CaO, 1)}% · MgO ${fmt(prod.MgO, 1)}% · PRNT ${fmt(prod.PRNT, 0)}%`]);
          } else if (cal.metodo === 'v') {
            const sV = stat(A.V);
            pg.objetivo = `Elevar V% a ${fmt(cal.vAlvo, 0)}%`;
            pg.porque.push(`V% médio de ${fmt(sV.mean, 1)}% (${rng(sV, 1, '%')}), meta de ${fmt(cal.vAlvo, 0)}%: ${pc(share(A.V, (v) => v < cal.vAlvo))} da área abaixo.`);
            pg.metodo = 'Saturação por bases (V%).';
            if (opts.formulas) { pg.formula = ['NC (t/ha) = (V2 − V1) × T / PRNT × prof/20 / eficiência']; pg.params.push(['V% desejado', fmt(cal.vAlvo, 0) + '%'], ['Camada corrigida', `0–${fmt(cal.prof, 0)} cm`], ['Eficiência', fmt(cal.eficV || 1, 2)], ['Corretivo', `${prod.nome}: PRNT ${fmt(prod.PRNT, 0)}%`]); }
          } else if (cal.metodo === 'al') {
            const sAl = stat(A.Al), sm = stat(A.m);
            pg.objetivo = 'Neutralizar o Al³⁺ e suprir Ca e Mg';
            if (sAl.n) pg.porque.push(`Al³⁺ médio de ${fmt(sAl.mean, 2)} cmolc/dm³; m% médio de ${fmt(sm.mean, 1)}% (máximo tolerado ${fmt(cal.mt, 0)}%): ${pc(share(A.m, (v) => v > cal.mt))} da área acima.`);
            pg.metodo = 'Neutralização do Al³⁺ e suprimento de Ca e Mg (5ª Aproximação / Embrapa Cerrados).';
            if (opts.formulas) { pg.formula = ['NC (t/ha) = Y × [Al − (mt × t / 100)] + [X − (Ca + Mg)], × prof/20 × 100/PRNT', 'Y = 0,0302 + 0,06532 × argila − 0,000257 × argila² (argila em %)']; pg.params.push(['mt (m% tolerada)', fmt(cal.mt, 0) + '%'], ['X (Ca+Mg)', fmt(cal.X, 1) + ' cmolc/dm³'], ['Fator Y', cal.ySrc === 'argila' ? 'pela argila' : 'fixo ' + fmt(cal.yFixo, 1)], ['Camada corrigida', `0–${fmt(cal.prof, 0)} cm`]); }
          }
          if (cE && opts.efeito) {
            if (cal.metodo === 'caMg') {
              pg.efeito.push(`Ca na CTC: ${fmt(stat(A.CaT).mean, 1)}% → ${fmt(cE.caT.mean, 1)}% (média); Mg na CTC: ${fmt(stat(A.MgT).mean, 1)}% → ${fmt(cE.mgT.mean, 1)}%.`);
              pg.efeito.push(`Área com Ca na faixa de tolerância: ${pc(cE.caOk0)} → ${pc(cE.caOk)}; com Mg: ${pc(cE.mgOk0)} → ${pc(cE.mgOk)}. Inclui as fontes complementares.`);
            } else if (cal.metodo === 'v') pg.efeito.push(`V% estimado após a calagem: média de ${fmt(cE.vA.mean, 1)}% (antes ${fmt(stat(A.V).mean, 1)}%).`);
            else pg.efeito.push(`Neutraliza o Al³⁺ trocável até m% ≤ ${fmt(cal.mt, 0)}% e eleva Ca + Mg a ${fmt(cal.X, 1)} cmolc/dm³ (estimativa do método).`);

          const nut = id === 'calCa' ? 'Ca' : 'Mg';
          const cmp = id === 'calCa' ? cal.compCa : cal.compMg;
          pg.objetivo = `Complementar o ${nut}`;
          pg.porque.push(`Fonte complementar de ${nut}: entra onde a dose do corretivo principal não leva o ${nut} à faixa de tolerância (${pc(s.pctAp)} da área).`);
          pg.metodo = `Complemento de ${nut} da calagem por saturação na CTC.`;
          if (opts.formulas) pg.params.push(['Produto', `${prod.nome}: CaO ${fmt(prod.CaO, 1)}% · MgO ${fmt(prod.MgO, 1)}% · PRNT ${fmt(prod.PRNT, 0)}%`], ['Eficiência', fmt(cmp.efic, 2)]);
          if (opts.efeito) pg.efeito.push('O efeito no Ca e no Mg está somado ao da calagem principal (página da calagem).');
        } else if (id === 'gesso') {
          pg.objetivo = 'Ca e S em subsuperfície';
          if (ges.metodo !== 'fixo' && ges.criterio !== 'sempre') {
            if (B) {
              const ga = Array.from(diag.gesAplica).filter((x) => x >= 0);
              const aplica = ga.length ? ga.filter((x) => x === 1).length / ga.length * 100 : null;
              pg.porque.push(`Critério: Ca ≤ ${fmt(ges.caMax, 1)} cmolc/dm³ ${ges.criterio === 'e' ? 'e' : 'ou'} m% ≥ ${fmt(ges.mMin, 0)}% em ${depthSub} cm, atendido em ${pc(aplica)} da área.`);
              const sCa = stat(B.Ca), sm = stat(B.m);
              if (sCa.n) pg.porque.push(`Em ${depthSub} cm: Ca médio de ${fmt(sCa.mean, 2)} cmolc/dm³ (${rng(sCa, 2)})${sm.n ? `; m% médio de ${fmt(sm.mean, 1)}% (${rng(sm, 1, '%')})` : ''}.`);
            } else pg.porque.push(`Sem análise de ${depthSub} cm: ${ges.semSub === 'aplicar' ? 'gesso recomendado sem avaliar o critério.' : 'o critério não pôde ser avaliado.'}`);
          } else pg.porque.push(ges.metodo === 'fixo' ? `Dose fixa de ${fmt(ges.doseFixa, 0)} kg/ha.` : 'Gesso recomendado em toda a área (sem critério de subsuperfície).');
          const MET = { embrapa: `Embrapa Cerrados: NG (kg/ha) = ${fmt(ges.fatorEmbrapa, 0)} × argila (%)`, raij: 'IAC (Raij, Boletim 100): NG (kg/ha) = 6 × argila (g/kg)', caires: 'Caires & Guimarães: NG (t/ha) = (0,6 × CTCe − Ca) × 6,4', vitti: `V% da subsuperfície: NG (t/ha) = (${fmt(ges.vAlvoSub, 0)} − V%) × T / 50`, fixo: 'Dose fixa' };
          pg.metodo = 'Gessagem: ' + (MET[ges.metodo] || ges.metodo) + '.';
          const sArg = stat(B && B.Arg ? B.Arg : A.Arg);
          if (opts.formulas) pg.params.push(['Argila usada', sArg.n ? `média de ${fmt(sArg.mean, 1)}% (${rng(sArg, 1, '%')})` : '—'], ['Produto', `${prod.nome}: CaO ${fmt(prod.CaO, 1)}% · S ${fmt(prod.S, 1)}%`]);
          if (opts.efeito) {
            const caKg = meanApplied(F.cell, (i, r) => r * (prod.CaO || 0) / 100 * 0.7147), sKg = meanApplied(F.cell, (i, r) => r * (prod.S || 0) / 100);
            pg.efeito.push(`Fornece em média ${fmt(caKg, 0)} kg/ha de Ca e ${fmt(sKg, 0)} kg/ha de S nas áreas aplicadas (${pc(s.pctAp)} do talhão).`);
          }
        } else if (id === 'fos') {
          const sP = stat(A[pKey]), nc = stat(diag.fosNC);
          pg.objetivo = 'Corrigir o P e repor a exportação';
          pg.porque.push(`P (${EXTRATOR[fo.extrator] || fo.extrator}): média de ${fmt(sP.mean, 1)} mg/dm³ (${rng(sP, 1)}); nível crítico de ${nc.n ? (nc.max > nc.min ? `${fmt(nc.min, 0)} a ${fmt(nc.max, 0)}` : fmt(nc.mean, 0)) : '—'} mg/dm³${fo.metodo === 'tampao' ? ' pela argila' : ''}: ${pc(share(A[pKey], (v, i) => ok(diag.fosNC[i]) && v < diag.fosNC[i]))} da área abaixo do NC.`);
          if (diag.fosManut > 0) pg.porque.push(`Manutenção: reposição de ${fmt(diag.fosManut, 0)} kg/ha de P₂O₅ (${fmt((crop.exportacao || {}).P2O5, 1)} kg/t × ${fmt(yieldT, 2)} t/ha${fo.fatorManut !== 1 ? ' × ' + fmt(fo.fatorManut, 2) : ''}).`);
          pg.metodo = fo.metodo === 'tampao' ? `Nível crítico × capacidade tampão (Embrapa Cerrados, ${fo.tabela === 'T2' ? 'Tabela 2' : 'Tabela 3'}${fo.sistema === 'irrigado' ? ', sistema irrigado: NC × 1,4' : ', sequeiro'}).` : 'Nível crítico e fator fixos (planilha de fósforo Wehrmann).';
          if (opts.formulas) {
            pg.formula = ['P₂O₅ (kg/ha) = (NC − P solo) × CT × prof/20 × fração + manutenção − crédito', 'Dose (kg/ha) = P₂O₅ / teor de P₂O₅ da fonte / eficiência'];
            pg.params.push(['Camada', `0–${fmt(fo.prof, 0)} cm`], ['Fração da corretiva', fmt(fo.fracao, 2)]);
            if (fo.metodo === 'fixo') pg.params.push(['NC e CT', `${fmt(fo.ncFixo, 0)} mg/dm³ · ${fmt(fo.ctFixo, 1)} kg P₂O₅ por mg/dm³`]);
            else { const ct = stat(diag.fosCT); pg.params.push(['CT (pela argila)', ct.n ? `${fmt(ct.min, 0)}${ct.max > ct.min ? '–' + fmt(ct.max, 0) : ''} kg P₂O₅ por mg/dm³` : '—']); }
            pg.params.push(['Manutenção', fo.manutencao === 'exportacao' ? 'reposição da exportação' : fo.manutencao === 'fixa' ? `${fmt(fo.manutFixa, 0)} kg P₂O₅/ha` : 'sem'], ['Crédito', `${fmt(fo.credito || 0, 0)} kg P₂O₅/ha`], ['Fonte', `${prod.nome}: P₂O₅ ${fmt(prod.P2O5, 1)}%`]);
          }
          if (opts.efeito && A[pKey]) {
            const n = grid.idx.length, pA = new Float32Array(n).fill(NaN);
            const man = diag.fosManut || 0, cred = fo.credito || 0, teor = (prod.P2O5 || 0) / 100, ef = fo.efic || 1;
            for (let q = 0; q < n; q++) {
              const p0 = A[pKey][q], ct = diag.fosCT[q]; if (!ok(p0) || !ok(ct) || ct <= 0) continue;
              const dose = ok(F.cell[q]) ? F.cell[q] : 0;
              const corr = Math.max(0, dose * teor * ef + cred - man);
              pA[q] = p0 + corr / (ct * fo.prof / 20);
            }
            pg.efeito.push(`P estimado após a correção: média de ${fmt(stat(pA).mean, 1)} mg/dm³; ${pc(share(pA, (v, i) => ok(diag.fosNC[i]) && v >= diag.fosNC[i] - 0.05))} da área no nível crítico ou acima.`);
            if (man > 0) pg.efeito.push(`Repõe ${fmt(man, 0)} kg/ha de P₂O₅ exportados pela colheita prevista.`);
          }
        } else if (id === 'pot') {
          const sKT = stat(A.KT), sK = stat(A.K);
          pg.objetivo = po.metodo === 'kctc' ? `Elevar K a ${fmt(po.kAlvo, 1)}% da CTC e repor a exportação` : 'Corrigir o K e repor a exportação';
          if (po.metodo === 'kctc') pg.porque.push(`K na CTC: média de ${fmt(sKT.mean, 2)}% (${rng(sKT, 2, '%')}), meta de ${fmt(po.kAlvo, 1)}%: ${pc(share(A.KT, (v) => v < po.kAlvo))} da área abaixo. K médio de ${fmt(sK.mean, 0)} mg/dm³.`);
          else pg.porque.push(`K médio de ${fmt(sK.mean, 0)} mg/dm³ (${rng(sK, 0)}); nível crítico de ${fmt(po.ncBaixa, 0)} mg/dm³ (CTC < 4) ou ${fmt(po.ncAlta, 0)} mg/dm³: ${pc(share(A.K, (v, i) => ok(diag.potAlvo[i]) && v < diag.potAlvo[i]))} da área abaixo.`);
          if (diag.potManut > 0) pg.porque.push(`Manutenção: reposição de ${fmt(diag.potManut, 0)} kg/ha de K₂O (${fmt((crop.exportacao || {}).K2O, 1)} kg/t × ${fmt(yieldT, 2)} t/ha).`);
          pg.metodo = po.metodo === 'kctc' ? 'Meta de K na CTC (planilha de potássio Wehrmann).' : 'Nível crítico de K por classe de CTC (Embrapa Cerrados).';
          if (opts.formulas) {
            pg.formula = ['K₂O (kg/ha) = (alvo − K solo) × prof/10 × 1,204 × fração + manutenção − crédito', po.metodo === 'kctc' ? `Alvo (mg/dm³) = T × ${fmt(po.kAlvo, 1)}% × 391` : 'Alvo = NC conforme a CTC', 'Dose (kg/ha) = K₂O / teor de K₂O da fonte'];
            pg.params.push(['Camada', `0–${fmt(po.prof, 0)} cm`], ['Fração da corretiva', fmt(po.fracao, 2)], ['Manutenção', po.manutencao === 'exportacao' ? 'reposição da exportação' : po.manutencao === 'fixa' ? `${fmt(po.manutFixa, 0)} kg K₂O/ha` : 'sem'], ['Crédito', `${fmt(po.credito || 0, 0)} kg K₂O/ha`], ['Fonte', `${prod.nome}: K₂O ${fmt(prod.K2O, 1)}%`]);
          }
          if (opts.efeito && A.K && A.T) {
            const n = grid.idx.length, kA = new Float32Array(n).fill(NaN);
            const man = diag.potManut || 0, cred = po.credito || 0, teor = (prod.K2O || 0) / 100;
            for (let q = 0; q < n; q++) {
              const k0 = A.K[q], T = A.T[q]; if (!ok(k0) || !ok(T) || T <= 0) continue;
              const dose = ok(F.cell[q]) ? F.cell[q] : 0;
              const corr = Math.max(0, dose * teor + cred - man);
              const k1 = k0 + corr / ((po.prof / 10) * 1.204);
              kA[q] = po.metodo === 'kctc' ? k1 / 391 / T * 100 : k1;
            }
            if (po.metodo === 'kctc') pg.efeito.push(`K na CTC estimado após a correção: média de ${fmt(stat(kA).mean, 2)}%; ${pc(share(kA, (v) => v >= po.kAlvo - 0.01))} da área na meta ou acima.`);
            else pg.efeito.push(`K estimado após a correção: média de ${fmt(stat(kA).mean, 0)} mg/dm³; ${pc(share(kA, (v, i) => ok(diag.potAlvo[i]) && v >= diag.potAlvo[i] - 0.5))} da área no NC ou acima.`);
            if (man > 0) pg.efeito.push(`Repõe ${fmt(man, 0)} kg/ha de K₂O exportados pela colheita prevista.`);
          }
        } else if (id === 'nitPl' || id === 'nitCob') {
          const ni = crop.nitrogenio || {};
          const sT = stat(diag.nitTotal), sAj = stat(diag.nitAjuste), sMO = stat(A.MO), sF = stat(diag.nitFos);
          const base = ni.metodo === 'fixo' ? ni.doseFixa : (ni.fator || 0) * yieldT;
          pg.objetivo = id === 'nitPl' ? 'N de arranque no plantio' : `N em cobertura${(ni.parcelas || 1) > 1 ? ` em ${ni.parcelas} parcelas` : ''}`;
          pg.porque.push(`Necessidade total de N: ${ni.metodo === 'fixo' ? `dose fixa de ${fmt(ni.doseFixa, 0)} kg N/ha` : `${fmt(ni.fator, 0)} kg de N por tonelada × ${fmt(yieldT, 2)} t/ha esperadas = ${fmt(base, 0)} kg N/ha`}${ni.creditoAnterior ? `, menos ${fmt(ni.creditoAnterior, 0)} kg N/ha de crédito da cultura anterior` : ''}${sT.n ? ` → ${fmt(sT.mean, 0)} kg N/ha em média (${rng(sT, 0, 'kg/ha')})` : ''}.`);
          if (ni.ajusteMO && ni.ajusteMO.ativo) pg.porque.push(sMO.n ? `Ajuste pela matéria orgânica: MO média de ${fmt(sMO.mean, 2)}% (${rng(sMO, 2, '%')}) → ajuste médio de ${fmt(sAj.mean, 0)} kg N/ha (${rng(sAj, 0, 'kg/ha')}); é o que faz a dose variar no mapa.` : 'Ajuste pela matéria orgânica ativo, mas o laudo não tem MO: sem ajuste.');
          if (id === 'nitPl') {
            pg.porque.push(`Plantio: ${fmt(ni.plantio, 0)} kg N/ha${sF.n && sF.mean > 0 ? `, descontados em média ${fmt(sF.mean, 0)} kg N/ha já contidos na fonte fosfatada (${PR(crop.fosforo.produto).nome || 'MAP/DAP'})` : ''}.`);
          } else {
            pg.porque.push(`Cobertura: o que falta depois do plantio (${fmt(ni.plantio || 0, 0)} kg N/ha)${(ni.parcelas || 1) > 1 ? `, dividida em ${ni.parcelas} aplicações iguais` : ''}; a dose do mapa é o total da cobertura.`);
          }
          pg.metodo = `Nitrogênio pela produtividade esperada (kg N/t × t/ha) com ajuste pela MO da célula e créditos; parte no plantio e o restante em cobertura — referências: Sousa & Lobato (Embrapa Cerrados, 2004), Manual RS/SC (CQFS 2016), Boletim 100 (IAC); parâmetros da cultura a validar.`;
          if (opts.formulas) {
            pg.formula = ['N total (kg/ha) = fator × produtividade (ou dose fixa) + ajuste pela MO − crédito da cultura anterior', 'N plantio = mín(plantio, total) − N da fonte fosfatada · N cobertura = total − plantio', 'Dose (kg/ha) = N / teor de N do produto'];
            const cls = (ni.ajusteMO && ni.ajusteMO.classes || []).map((c, i, arr) => `${i ? '>' + fmt(arr[i - 1].ate, 1) + '–' : '≤'}${c.ate >= 999 ? '' : fmt(c.ate, 1) + '%'}${c.ate >= 999 ? 'acima' : ''}: ${c.kg >= 0 ? '+' : ''}${fmt(c.kg, 0)}`).join(' · ');
            pg.params.push(['Fator / dose', ni.metodo === 'fixo' ? `${fmt(ni.doseFixa, 0)} kg N/ha (fixa)` : `${fmt(ni.fator, 1)} kg N por t · produtividade ${fmt(yieldT, 2)} t/ha`], ['Plantio', `${fmt(ni.plantio || 0, 0)} kg N/ha${ni.creditoFosfato ? ' (desconta N do MAP/DAP)' : ''}`], ['Ajuste por MO', ni.ajusteMO && ni.ajusteMO.ativo ? cls + ' kg N/ha' : 'desligado'], ['Crédito anterior', `${fmt(ni.creditoAnterior || 0, 0)} kg N/ha`], ['Fonte', `${prod.nome}: N ${fmt(prod.N, 1)}%${prod.S ? ` · S ${fmt(prod.S, 1)}%` : ''}`]);
          }
          if (opts.efeito) {
            const nKg = meanApplied(F.cell, (i, r) => r * (prod.N || 0) / 100);
            pg.efeito.push(`Fornece em média ${fmt(nKg, 0)} kg/ha de N nas áreas aplicadas (${pc(s.pctAp)} do talhão)${prod.S ? `, mais ${fmt(meanApplied(F.cell, (i, r) => r * prod.S / 100), 0)} kg/ha de S` : ''}. O N não fica no solo: a resposta é na cultura, não no laudo seguinte.`);
          }
        } else if (id[0] === 'm') {
          const nu = id.slice(1), cfg = mic[nu];
          const sN = stat(A[nu]), cd = classDist(diag.cls[nu]), l = lim[nu];
          const nome = MICRO_NOME[nu] || nu;
          if (!pg.objetivo) pg.objetivo = nu === 'S' ? 'Suprir enxofre' : `${nome} por classe de teor`;
          else pg.objetivo += nu === 'S' ? ' + enxofre' : ' + ' + nu;
          if (sN.n) pg.porque.push(`${nome}${nu === 'S' ? ' (S-SO₄)' : ''}: média de ${fmt(sN.mean, 2)} mg/dm³ (${rng(sN, 2)}). Classes${nu === 'S' || nu === 'B' ? '' : ' (' + (EXTRATOR[mic.extrator] || mic.extrator) + ')'}: baixo até ${fmt(l[0], 2)} em ${pc(cd && cd.baixo)} da área, médio até ${fmt(l[1], 2)} em ${pc(cd && cd.medio)}, adequado no restante.`);
          if (nu === 'S') {
            const so = stat(diag.sOutros);
            if (so.n && so.mean > 0) pg.porque.push(`O S já fornecido pelos outros produtos (gesso, superfosfato simples, sulfatos) é descontado: em média ${fmt(so.mean, 1)} kg/ha.`);
          }
          if (!pg.metodo) pg.metodo = 'Dose do elemento por classe de teor no solo (Galrão 2004; Boletim 100; Sousa & Lobato 2004).';
          if (opts.formulas) pg.params.push([`${nu}: dose por classe`, `baixo ${fmt(cfg.doses[0], 1)} · médio ${fmt(cfg.doses[1], 1)} · adequado ${fmt(cfg.doses[2], 1)} kg/ha de ${nu}`], ['Fonte', `${prod.nome}: ${nu} ${fmt(prod[nu], 1)}%`]);
          if (opts.efeito && !(nu === 'S' && pg.id !== id)) {
            const el = meanApplied(F.cell, (i, r) => r * (prod[nu] || 0) / 100);
            pg.efeito.push(`Fornece em média ${fmt(el, nu === 'S' ? 0 : 1)} kg/ha de ${nu} nas áreas aplicadas (${pc(s.pctAp)} do talhão).`);
          }
        }
      }
      if (!pg.porque.length) pg.porque.push('Sem diagnóstico disponível para esta aplicação.');
      pages.push(pg);
    }

    // ---------------------------------------------------------------- tabela de aplicações e totais
    const apps = pages.map((pg) => {
      const d = defs.find((x) => x.id === pg.id), s = pg.sum;
      return { id: pg.id, style: pg.style, produto: pg.produto, modulo: pg.titulo, objetivo: pg.objetivo, media: s.media, min: s.min, max: s.max, minAp: s.minAp, areaAp: s.areaAp, pctAp: s.pctAp, totalT: s.totalT, custoHa: s.custoHa, custoTotal: s.custoTotal, preco: d.produto.preco || null };
    });
    const custoTotal = apps.reduce((a, x) => a + (x.custoTotal || 0), 0);
    const semPreco = apps.filter((x) => x.custoTotal == null).map((x) => x.produto);
    const area = ctx.meta && ctx.meta.areaHa ? ctx.meta.areaHa : (apps[0] ? (final[apps[0].id] || {}).sum.area : 0);
    const totals = { custoTotal, custoHa: area ? custoTotal / area : null, semPreco, areaHa: area };

    // ---------------------------------------------------------------- anexo: atributos que sustentam as doses
    const want = ['V', 'CaT', 'MgT', 'KT', 'm', pKey, 'K', 'S', 'B', 'Zn', 'Cu', 'Mn', 'Arg', 'MO'];
    const annex = want.filter((k, i) => A[k] && want.indexOf(k) === i).map((k) => ({ key: k, layer: 'sup', stat: stat(A[k]), info: sup.info[k] || null }));
    if (B && ges.metodo !== 'nenhum') { if (B.Ca) annex.push({ key: 'Ca', layer: 'sub', stat: stat(B.Ca), info: sub.info.Ca || null }); if (B.m) annex.push({ key: 'm', layer: 'sub', stat: stat(B.m), info: null }); }

    return { meta: ctx.meta || {}, opts, diagnosis, apps, totals, pages, annex, orcGlobalRes: ctx.orcGlobalRes || null };
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* =====================================================================
 * Modo Campo · armazenamento no celular (IndexedDB): áreas (mapas já calculados),
 * anotações de campo (com foto) e configurações.
 * ===================================================================== */
(function () {
  'use strict';
  const CP = (window.CAMPO = {});
  CP.VERSAO = 'v2.5';

  let dbP = null;
  function idb() {
    if (dbP) return dbP;
    dbP = new Promise((res, rej) => {
      if (!window.indexedDB) { rej(new Error('Este navegador não guarda dados (IndexedDB indisponível).')); return; }
      const rq = indexedDB.open('modo-campo', 1);
      rq.onupgradeneeded = () => {
        const d = rq.result;
        if (!d.objectStoreNames.contains('areas')) d.createObjectStore('areas', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('notas')) { const s = d.createObjectStore('notas', { keyPath: 'id' }); s.createIndex('areaId', 'areaId', { unique: false }); }
        if (!d.objectStoreNames.contains('config')) d.createObjectStore('config');
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error || new Error('IndexedDB'));
    });
    return dbP;
  }
  const tx = (store, mode, fn) => idb().then((d) => new Promise((res, rej) => {
    const t = d.transaction(store, mode); const r = fn(t.objectStore(store));
    t.oncomplete = () => res(r && typeof r === 'object' && 'result' in r ? r.result : r); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));

  CP.db = {
    /** Lista resumida das áreas (sem as grades). */
    async listAreas() {
      const all = await tx('areas', 'readonly', (s) => s.getAll());
      return (all || []).map((a) => ({ id: a.id, nome: a.nome, job: a.job, importadoEm: a.importadoEm, sessaoSalvaEm: a.sessaoSalvaEm, areaHa: a.areaHa, nLayers: a.layers.length, nPoints: a.points.length, cropNome: a.cropNome }))
        .sort((x, y) => (y.importadoEm || '').localeCompare(x.importadoEm || ''));
    },
    getArea: (id) => tx('areas', 'readonly', (s) => s.get(id)),
    putArea: (a) => tx('areas', 'readwrite', (s) => s.put(a)),
    async delArea(id) {
      await tx('areas', 'readwrite', (s) => s.delete(id));
      const notas = await CP.db.listNotas(id);
      for (const n of notas) await tx('notas', 'readwrite', (s) => s.delete(n.id));
    },
    async listNotas(areaId) {
      const all = await tx('notas', 'readonly', (s) => s.index('areaId').getAll(areaId));
      return (all || []).sort((a, b) => (a.t || '').localeCompare(b.t || ''));
    },
    putNota: (n) => tx('notas', 'readwrite', (s) => s.put(n)),
    delNota: (id) => tx('notas', 'readwrite', (s) => s.delete(id)),
    getConfig: (k, d) => tx('config', 'readonly', (s) => s.get(k)).then((v) => (v === undefined ? d : v)).catch(() => d),
    setConfig: (k, v) => tx('config', 'readwrite', (s) => s.put(v, k)).catch(() => false),

})();

/* =====================================================================
 * Modo Campo · abre um trabalho salvo (.prescricao.json) e recalcula, com o mesmo motor

    const products = Array.isArray(data.products) && data.products.length ? data.products : RE.PRODUCTS_DEFAULT.map((p) => Object.assign({}, p));
    const avisos = [];
    if (!Array.isArray(data.products) || !data.products.length) avisos.push('O trabalho foi salvo por uma versão anterior da plataforma: os produtos e preços usados são os padrão, e os custos podem diferir.');
    const cellHa = grid.cellArea / 1e4 * grid.areaFactor;
    let rx = null, fin = null;
    try {
      rx = RE.computeRx({ grid, sup, sub, samples, subSamples, crop, products, modo: data.modoRx || 'celula', interpOpts: { method: interp.method, power: interp.power, minPtsKriging: interp.minPts } });

    const view = Object.assign({ cls: 'iguais', ncls: 10, pal: 'rdylgn', inv: false }, data.view || {});
    const argMean = sup.attrs.Arg ? RE.stats(Array.from(sup.attrs.Arg)).mean : null;
    const layerOf = (grupo, key, values, forRx, extra) => {
      const at = RE.ATTR[key] || { label: key, short: key, unit: '', dec: 0 };
      const cls = RE.classify(values, forRx ? null : key, { cls: view.cls, ncls: view.ncls, pal: view.pal, inv: view.inv, forRx, target: !forRx && view.cls === 'meta' ? RE.targetOf(key, crop, argMean) : null });
      const st = RE.stats(Array.from(values));
      return Object.assign({ id: `${grupo}:${key}`, grupo, key, label: forRx ? extra.label : at.label, short: forRx ? extra.short : at.short, unit: forRx ? 'kg/ha' : at.unit, dec: forRx ? 0 : at.dec, values, br: cls.br, colors: cls.colors, legend: RE.legendItems(cls, forRx ? 0 : at.dec, forRx ? 'kg/ha' : at.unit), stats: { mean: st.mean, min: st.min, max: st.max } }, extra || {});

    const layers = [];
    for (const k of present(sup)) layers.push(layerOf('sup', k, sup.attrs[k], false, { metodo: (sup.info[k] || {}).method || 'derivado' }));
    if (sub) for (const k of present(sub)) layers.push(layerOf('sub', k, sub.attrs[k], false, { metodo: (sub.info[k] || {}).method || 'derivado' }));
    // camadas desligadas na plataforma ("não aplicar") ficam fora do celular, como ficam fora do resumo e das exportações
    const ruleOf = (id) => (data.rules && data.rules[id]) || RE.DEFAULT_RULE();

    const defs = rx ? rx.defs.filter((d) => !ruleOf(d.id).off && fin[d.id] && fin[d.id].sum.totalKg > 0) : [];
    // N no plantio e N em cobertura são aplicações distintas do mesmo produto: o rótulo leva o nome da aplicação
    const nomeRx = (d) => (d.separado ? `${d.produto.nome} · ${d.rotulo}` : d.produto.nome);
    for (const d of defs) layers.push(layerOf('rx', d.id, fin[d.id].cell, true, { label: nomeRx(d), short: nomeRx(d), modulo: d.separado ? d.rotulo : d.modulo, sum: fin[d.id].sum, preco: d.produto.preco || null }));
    if (desligadas.length) avisos.push('Não aplicar (decisão na plataforma): ' + desligadas.map((d) => nomeRx(d) + (ruleOf(d.id).motivo ? ` — ${ruleOf(d.id).motivo}` : '')).join('; ') + '.');

    const points = samples.map((s, i) => {
      const doses = {};
      for (const d of defs) { const raw = rx.point[d.id][i]; const F = fin[d.id]; const v = RE.applyRule(raw == null ? null : raw * F.kg, ruleOf(d.id), F.adj); if (v != null) doses[d.id] = v; }
      return { id: s.rec.idRaw, lon: s.lon, lat: s.lat, v: s.rec.v, d: RE.derive(s.rec.v), doses };
    });
    const subPoints = subSamples ? subSamples.map((s) => ({ id: s.rec.idRaw, lon: s.lon, lat: s.lat, v: s.rec.v, d: RE.derive(s.rec.v) })) : [];
    const rings = bnd ? bnd.features.flatMap((f) => f.rings) : grid.rings.map((r) => r.map(([x, y]) => RE.utmToLonLat(x, y, z.zone, z.south)));

    prog('Guardando…', 0.97);
    return {
      id: uid(), nome: [job.cliente, job.fazenda || ds.farm, job.talhao || ds.field, job.ano || ds.yearLabel].filter(Boolean).join(' · '),
      job, autor: data.autor || null, sessaoSalvaEm: data.salvoEm || null, importadoEm: new Date().toISOString(), versaoApp: CP.VERSAO,
      zone: z.zone, south: z.south,
      grid: { x0: grid.x0, y0: grid.y0, s: grid.s, nx: grid.nx, ny: grid.ny, mask: grid.mask, idx: grid.idx, cellArea: grid.cellArea, boundaryArea: grid.boundaryArea, areaFactor: grid.areaFactor },
      areaHa: grid.boundaryArea / 1e4, rings, layers, points, subPoints,
      cropNome: crop.nome, depthSup: sel.depthSup, depthSub: sub ? sel.depthSub : null, cell: interp.cell, modoRx: data.modoRx || 'celula',

      avisos,

  /** Grade com os campos derivados necessários ao RE.cellAt (reconstruídos após ler do banco). */
  CP.gridOf = function (area) {
    const g = area.grid;
    if (!g.lookup) { g.lookup = new Int32Array(g.nx * g.ny).fill(-1); for (let q = 0; q < g.idx.length; q++) g.lookup[g.idx[q]] = q; }
    return g;
  };

  /** Valor, classe e cor de uma camada em (lon, lat). */
  CP.readAt = function (area, layer, lon, lat) {
    const [x, y] = RE.lonLatToUTM(lon, lat, area.zone, area.south);
    const q = RE.cellAt(CP.gridOf(area), x, y);
    if (q < 0) return { inside: false, x, y };
    const v = layer.values[q];
    if (v == null || Number.isNaN(v)) return { inside: true, x, y, q, value: null };
    const c = RE.classOf(v, layer.br);
    return { inside: true, x, y, q, value: v, cls: c, color: c >= 0 ? layer.colors[c] : null, range: c >= 0 ? `${fmt(layer.br[c], layer.dec)} – ${fmt(layer.br[c + 1], layer.dec)}` : '' };
  };

  /** Ponto de coleta mais próximo de (x, y) UTM: {p, dist}. */
  CP.nearestPoint = function (area, x, y, sub) {
    let best = null, bd = Infinity;
    for (const p of (sub ? area.subPoints : area.points)) {
      const [px, py] = RE.lonLatToUTM(p.lon, p.lat, area.zone, area.south);
      const d = Math.hypot(px - x, py - y);
      if (d < bd) { bd = d; best = p; }
    }
    return best ? { p: best, dist: bd } : null;
  };

  /** Valor de um ponto de coleta para a camada (laudo, derivado ou dose final). */
  CP.pointValue = function (layer, p) {
    if (layer.grupo === 'rx') return p.doses ? p.doses[layer.key] : null;
    const v = p.v[layer.key];
    if (v != null) return v;
    return p.d ? p.d[layer.key] : null;
  };
})();

/* =====================================================================
 * Modo Campo · GPS do aparelho (watchPosition), bússola (orientação do aparelho)
 * e tela sempre ligada (Wake Lock).
 * ===================================================================== */
(function () {
  'use strict';
  const CP = window.CAMPO;

  const G = (CP.gps = { watchId: null, last: null, compass: null, onFix: null, onError: null, permission: 'desconhecida' });

  /** Começa a acompanhar a posição. onFix({lon, lat, acc, speed, heading, t}). */
  G.start = function (onFix, onError) {
    G.onFix = onFix; G.onError = onError;
    if (!navigator.geolocation) { onError && onError('Este navegador não dá acesso ao GPS.'); return false; }
    G.stop();
    G.watchId = navigator.geolocation.watchPosition((pos) => {
      const c = pos.coords;
      const gpsHeading = c.heading != null && Number.isFinite(c.heading) && c.speed != null && c.speed > 0.7 ? c.heading : null;
      G.last = { lon: c.longitude, lat: c.latitude, acc: c.accuracy, alt: c.altitude, speed: c.speed, gpsHeading, heading: gpsHeading != null ? gpsHeading : G.compass, t: pos.timestamp || Date.now() };
      G.permission = 'ok';
      onFix && onFix(G.last);
    }, (err) => {
      const msg = err.code === 1 ? 'Permissão de localização negada. Libere a localização para este site nas configurações do navegador.' : err.code === 2 ? 'Sem sinal de GPS no momento. Vá para um lugar aberto.' : 'O GPS demorou a responder; continuando a tentar.';
      if (err.code === 1) G.permission = 'negada';
      onError && onError(msg, err.code);
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    return true;
  };
  G.stop = function () { if (G.watchId != null) { navigator.geolocation.clearWatch(G.watchId); G.watchId = null; } };
  G.stale = () => !G.last || Date.now() - G.last.t > 20000;

  // ---------------------------------------------------------------- bússola
  let compassOn = false;
  function onOrient(e) {
    let h = null;
    if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;             // iOS
    else if (e.absolute && e.alpha != null) h = (360 - e.alpha) % 360;           // Android (deviceorientationabsolute)
    if (h == null || !Number.isFinite(h)) return;
    G.compass = h;
    if (G.last && G.last.gpsHeading == null) { G.last.heading = h; G.onFix && G.onFix(G.last); }
  }
  /** Liga a bússola (no iPhone precisa de um toque do usuário para pedir a permissão). */
  G.startCompass = async function () {
    if (compassOn) return true;
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') return false;
        window.addEventListener('deviceorientation', onOrient, true);
      } else if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', onOrient, true);
      else window.addEventListener('deviceorientation', onOrient, true);
      compassOn = true; return true;
    } catch (e) { return false; }
  };

  // ---------------------------------------------------------------- tela ligada
  let lock = null, wantLock = false;
  G.keepAwake = async function (on) {
    wantLock = on;
    if (!('wakeLock' in navigator)) return false;

      if (on && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); }

  /** Distância (m) entre dois lon/lat. */
  G.distance = function (a, b) {
    const R = 6371008.8, d2r = Math.PI / 180;
    const dLat = (b[1] - a[1]) * d2r, dLon = (b[0] - a[0]) * d2r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * d2r) * Math.cos(b[1] * d2r) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };
})();
